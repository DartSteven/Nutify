services:
  # Main Nutify application and NUT monitoring service.
  nut:
    # Select the tag matching the host CPU. This default is for AMD64/x86_64.
    image: dartsteven/nutify:latest-amd64
    container_name: Nutify

    # Secure network-client profile: no privileged mode or host device mounts.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # Prepare ownership on persistent files.
      - DAC_OVERRIDE # Access bind mounts during startup preparation.
      - FOWNER       # Adjust modes on prepared files.
      - KILL         # Supervise child processes.
      - SETGID       # Drop to the runtime group.
      - SETUID       # Drop to the runtime user.
    security_opt:
      - no-new-privileges:true

    # USB HID discovery without privileged mode or a complete /dev mount.
    device_cgroup_rules:
      - "c 189:* rwm"

    # Persistent host data retained across image updates.
    volumes:
      - ./Nutify/logs:/app/nutify/logs         # Application and NUT logs.
      - ./Nutify/instance:/app/nutify/instance # Database and runtime state.
      - ./Nutify/ssl:/app/ssl                  # Optional TLS certificate/key.
      - ./Nutify/etc/nut:/etc/nut              # Generated NUT configuration.
      - /dev/bus/usb:/dev/bus/usb:rw           # USB devices for nut-scanner/NUT.
      - /run/udev:/run/udev:ro                 # Read-only USB identity metadata.

    # Base runtime settings. OIDC remains configurable from the web UI.
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env; generate it with openssl rand -hex 32}
      NUTIFY_WEB_USER: nut      # Unprivileged web process user.
      NUT_SERVICE_USER: nut     # Unprivileged NUT command user.
      UDEV: "1"                 # Enable USB/udev-aware discovery.
      SKIP_PERMCHECK: "true"    # Never mutate host USB device permissions.
      NUTIFY_USB_GID: ${NUTIFY_USB_GID:-} # Optional host USB group override.
      LOG: "true"               # Enable application logging.
      LOG_LEVEL: INFO            # Runtime log verbosity.
      LOG_WERKZEUG: "true"      # Enable HTTP access logs.
      ENABLE_LOG_STARTUP: Y      # Enable safe startup diagnostics.
      SSL_ENABLED: "false"      # Enable only with valid mounted TLS files.
      SOCKETIO_ALLOWED_ORIGINS: ${SOCKETIO_ALLOWED_ORIGINS:-}

    # External DNS with short timeout and one fallback resolver.
    dns:
      - 1.1.1.1 # Cloudflare DNS.
      - 8.8.8.8 # Google Public DNS fallback.
    dns_opt:
      - timeout:2 # Seconds per attempt.
      - attempts:2 # Attempts before failure.

    # Published NUT, HTTP, and optional HTTPS ports.
    ports:
      - "3493:3493" # NUT upsd endpoint.
      - "5050:5050" # Nutify HTTP interface.
      - "443:443"   # Nutify HTTPS interface.

    # Restart after crashes and host reboots until explicitly stopped.
    restart: always

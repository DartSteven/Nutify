services:
  nut:
#    build: .
    image: dartsteven/test:amd64-0.1.6RC01
    container_name: Nutify
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
      - MKNOD
    devices:
      - /dev/bus/usb:/dev/bus/usb:rwm
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - ./Nutify/logs:/app/nutify/logs
      - ./Nutify/instance:/app/nutify/instance
      - ./Nutify/ssl:/app/ssl
      - ./Nutify/etc/nut:/etc/nut
      - /dev:/dev:rw              # Full /dev access improves hotplug handling
      - /run/udev:/run/udev:ro    # Access to udev events
    environment:
      # ==== NUTIFY SERVER CONFIGURATION ====
      - NUTIFY_LISTEN_HOST=0.0.0.0
      - NUTIFY_HTTP_PORT=${NUTIFY_HTTP_PORT:-5050}
      - NUTIFY_HTTPS_PORT=${NUTIFY_HTTPS_PORT:-8443}
      - SERVER_HOST=${NUTIFY_LISTEN_HOST}
      - SERVER_PORT=${NUTIFY_HTTP_PORT}
      # ===== LOGGING / RUNTIME CONFIGURATION =====
      - LOG=true
      - LOG_LEVEL=DEBUG
      - LOG_WERKZEUG=true
      - ENABLE_LOG_STARTUP=Y
      - SSL_ENABLED=false
      - SECRET_KEY=test1234567890 # for password encryption and decryption in the database
      - UDEV=1                    # Improve USB detection
    ports:
      - 3493:3493
      - "${NUTIFY_HTTP_PORT:-5050}:${NUTIFY_HTTP_PORT:-5050}"
      - "${NUTIFY_HTTPS_PORT:-8443}:${NUTIFY_HTTPS_PORT:-8443}"
    restart: always
    user: root
    healthcheck:
      test: >
        bash -c '
          set -e
          if [ "${SSL_ENABLED}" = "true" ]; then
            curl -ksf "https://127.0.0.1:${NUTIFY_HTTPS_PORT:-8443}/" > /dev/null
          else
            curl -fs  "http://127.0.0.1:${NUTIFY_HTTP_PORT:-5050}/"  > /dev/null
          fi
        '
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

# Advanced authentication override for environment-managed OpenID Connect.
# Start it together with docker-compose.yaml; do not run this file alone:
# docker compose -f docker-compose.yaml -f docker-compose.oidc.yaml up -d
services:
  nut:
    environment:
      # Lock OIDC settings to environment management. The Authentication page
      # becomes read-only, which is suitable for automated deployments.
      OIDC_CONFIG_SOURCE: environment
      OIDC_ENABLED: "true"

      # Provider endpoints and OAuth client credentials. All four values are
      # mandatory and must be stored in the uncommitted .env file.
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the HTTPS OIDC issuer URL in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OIDC client ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the OIDC client secret in .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the exact OIDC callback URL in .env}

      # Claims read from the ID token or UserInfo response.
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}

      # Authorization policy. An explicit administrator group is required;
      # regular users may be restricted to a separate provider group.
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:?Set the authorized OIDC admin group in .env}
      OIDC_USER_GROUP: ${OIDC_USER_GROUP:-}
      OIDC_ALLOW_ALL_USERS: "false"

      # Login-page presentation and redirect behavior.
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with Single Sign-On}
      OIDC_AUTO_REDIRECT: ${OIDC_AUTO_REDIRECT:-false}

      # Production OIDC must use HTTPS. Keep false outside loopback tests.
      OIDC_ALLOW_INSECURE_HTTP: "false"
